name: Setup
description: Set up Bun and Node, install dependencies, prepare env files, and restore the Turbo cache.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Keep in sync with the "packageManager" field in package.json.
        bun-version: 1.3.14

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Restore Turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Prepare environment files
      shell: bash
      run: cp .env.example .env.local && cp .env.example apps/org/.env.local
