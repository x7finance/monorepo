name: CI

on:
  pull_request:
  merge_group:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [format, lint, typecheck, check:cycles]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run ${{ matrix.task }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/org/.next/cache
          key: nextjs-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('**/bun.lock') }}-
      - run: bun run build
