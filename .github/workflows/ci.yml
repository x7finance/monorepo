name: CI

on:
  pull_request:
  merge_group:

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, check:cycles]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install

      - run: cp .env.example .env.local && cp .env.example apps/org/.env.local

      - run: bun run ${{ matrix.task }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install

      - run: cp .env.example .env.local && cp .env.example apps/org/.env.local

      - uses: actions/cache@v4
        with:
          path: apps/org/.next/cache
          key: nextjs-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: nextjs-${{ hashFiles('**/bun.lock') }}-

      - run: bun run build
