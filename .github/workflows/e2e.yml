name: E2E

on:
  deployment_status:

# Supersede an older E2E run for the same deployment URL (e.g. a branch redeploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Only run once the deployment has finished successfully.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: packages/e2e

      - name: Prepare E2E environment
        run: cp .env.example .env
        working-directory: packages/e2e

      - name: Run E2E tests
        run: bun run e2e
        working-directory: packages/e2e
        env:
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: packages/e2e/test-report/
          retention-days: 14
