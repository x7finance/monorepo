description: X7 Finance is a decentralized protocol for automated liquidity provision on EVM blockchains.
repository: https://github.com/x7finance/monorepo
specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # XChange Factory
  - kind: ethereum/contract
    name: XchangeFactory
    network: bsc
    source:
      address: "0x8B76C05676D205563ffC1cbd11c0A6e3d83929c5"
      abi: XchangeFactory
      startBlock: 41542872
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: XchangeFactory
          file: ./abis/XchangeFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/xchange-factory.ts
  # Uniswap V2 Factory
  - kind: ethereum/contract
    name: UniswapFactory
