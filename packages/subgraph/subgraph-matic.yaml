description: X7 Finance is a decentralized protocol for automated liquidity provision on EVM blockchains.
repository: https://github.com/x7finance/monorepo
specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # XChange Factory
  - kind: ethereum/contract
    name: XchangeFactory
    network: matic
    source:
      address: "0x8B76C05676D205563ffC1cbd11c0A6e3d83929c5"
      abi: XchangeFactory
      startBlock: 60840059
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: XchangeFactory
          file: ./abis/XchangeFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/xchange-factory.ts
  # Uniswap V2 Factory
  - kind: ethereum/contract
    name: UniswapFactory
    network: matic
    source:
      address: "0x9e5A52f57b3038F1B8EeE45F28b3C1967e22799C"
      abi: UniswapFactory
      startBlock: 49948178
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: UniswapFactory
          file: ./abis/UniswapFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/uniswap-factory.ts
  # Uniswap V3 Factory
  - kind: ethereum/contract
    name: UniswapV3Factory
    network: matic
    source:
      address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
      abi: UniswapV3Factory
      startBlock: 22757547
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PoolCreated
      abis:
        - name: UniswapV3Factory
          file: ./abis/UniswapV3Factory.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
      file: ./src/uniswap-factory.ts
  # SushiSwap V2 Factory
  - kind: ethereum/contract
    name: SushiFactory
    network: matic
    source:
      address: "0xc35DADB65012eC5796536bD9864eD8773aBc74C4"
      abi: SushiFactory
      startBlock: 11333218
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: SushiFactory
          file: ./abis/SushiFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/sushi-factory.ts
  # SushiSwap V3 Factory
  - kind: ethereum/contract
    name: SushiV3Factory
    network: matic
    source:
      address: "0x917933899c6a5F8E37F31E19f92CdBFF7e8FF0e2"
      abi: SushiV3Factory
      startBlock: 41024971
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PoolCreated
      abis:
        - name: SushiV3Factory
          file: ./abis/SushiV3Factory.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
      file: ./src/sushi-factory.ts
