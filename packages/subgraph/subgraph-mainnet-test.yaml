description: X7 Finance is a decentralized protocol for automated liquidity provision on EVM blockchains.
repository: https://github.com/x7finance/monorepo
specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # XChange Factory
  - kind: ethereum/contract
    name: XchangeFactory
    network: mainnet
    source:
      address: "0x8B76C05676D205563ffC1cbd11c0A6e3d83929c5"
      abi: XchangeFactory
      startBlock: 20323792
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: XchangeFactory
          file: ./abis/XchangeFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/xchange-factory.ts
  # Uniswap V2 Factory
  - kind: ethereum/contract
    name: UniswapFactory
    network: mainnet
    source:
      address: "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f"
      abi: UniswapFactory
      startBlock: 20323792
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: UniswapFactory
          file: ./abis/UniswapFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/uniswap-factory.ts
  # Uniswap V3 Factory
  - kind: ethereum/contract
    name: UniswapV3Factory
    network: mainnet
    source:
      address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
      abi: UniswapV3Factory
      startBlock: 20032888
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PoolCreated
      abis:
        - name: UniswapV3Factory
          file: ./abis/UniswapV3Factory.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
      file: ./src/uniswap-factory.ts
  # SushiSwap V2 Factory
  - kind: ethereum/contract
    name: SushiFactory
    network: mainnet
    source:
      address: "0xC0AEe478e3658e2610c5F7A4A2E1777cE9e4f2Ac"
      abi: SushiFactory
      startBlock: 18661857
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PairCreated
      abis:
        - name: SushiFactory
          file: ./abis/SushiFactory.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/sushi-factory.ts
  # SushiSwap V3 Factory
  - kind: ethereum/contract
    name: SushiV3Factory
    network: mainnet
    source:
      address: "0xbACEB8eC6b9355Dfc0269C18bac9d6E2Bdc29C4F"
      abi: SushiV3Factory
      startBlock: 20347470
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PoolCreated
      abis:
        - name: SushiV3Factory
          file: ./abis/SushiV3Factory.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
      file: ./src/sushi-factory.ts
